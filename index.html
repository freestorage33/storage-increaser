<!doctype html>
<html lang="en">
<head>

<title>Storage Increaser Web</title>
<style>
:root{--bg:#f4faf8;--card:#fff;--ink:#10211f;--soft:#3e5552;--mute:#667c79;--line:#d3e3e0;--teal:#00796b;--teal-d:#005a4f;--teal-l:#dff1ee;--amber:#8a5d00;--amber-l:#fff3d1;--red:#b3261e;--red-l:#fde8e6;--green:#17703a;--green-l:#e1f4e7;--blue:#1d5fa8;--blue-l:#e3eefb;--shadow:0 1px 2px rgba(16,33,31,.06),0 4px 14px rgba(16,33,31,.05);--r:14px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;color:var(--mute);font-size:12px}
.logo{flex:none;width:34px;height:34px;border-radius:10px;background:var(--teal);display:grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
main{max-width:900px;margin:0 auto;padding:14px 16px calc(90px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
h2{font-size:20px;margin:6px 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}

.card.good{background:var(--green-l);border-color:transparent}
.grid{display:grid;gap:12px}
@media (min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}.soft{color:var(--soft)}.small{font-size:13px}.tiny{font-size:12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--teal-l);color:var(--teal-d);white-space:nowrap;border:1px solid transparent}
.chip.amber{background:var(--amber-l);color:var(--amber)}.chip.red{background:var(--red-l);color:var(--red)}.chip.green{background:var(--green-l);color:var(--green)}.chip.blue{background:var(--blue-l);color:var(--blue)}.chip.gray{background:transparent;border-color:var(--line);color:var(--mute)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#06201b}}
.btn.dng{color:var(--red)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ico{padding:0;width:44px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input[type=text],input[type=search],input[type=number],select{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);width:100%}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--teal);flex:none}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;min-height:44px}
.field{display:grid;gap:4px;margin:0 0 10px}
.field>span{font-size:13px;color:var(--soft);font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);overflow-x:auto}
.tabs button{flex:1 0 auto;min-width:52px;min-height:56px;border:0;background:none;display:grid;place-items:center;gap:0;padding:6px 4px;font-size:10.5px;font-weight:600;color:var(--mute);position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected=true]{color:var(--teal)}
.tabs button[aria-selected=true]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
.badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;min-width:16px;text-align:center}

.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .25s}
.bar.ind>i{width:35%;position:absolute;animation:ind 1.2s ease-in-out infinite}

.bar.warn>i{background:#d99a00}.bar.bad>i{background:var(--red)}

.item{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);min-height:56px}
.item:last-child{border-bottom:0}
.item .chip{white-space:normal}
.item.sel{background:var(--teal-l);border-radius:10px}
.item .ic{font-size:24px;width:32px;text-align:center;flex:none}

.crumbs span.cur{font-weight:700;padding:8px 4px}

.selbar .btn{border-color:transparent}

th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px}
.scroll{overflow-x:auto}
dialog{border:0;border-radius:18px;padding:0;max-width:640px;width:calc(100% - 20px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:88vh}

.sheet-in{padding:16px;overflow:auto;max-height:88vh}
#toasts{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));display:grid;gap:8px;justify-items:center;z-index:60;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;max-width:520px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:auto}
.toast.err{background:#8f1d17;color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;overflow-wrap:anywhere}
.hex{font:12px/1.5 var(--mono);white-space:pre;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}

.ring{width:120px;height:120px;flex:none}
details>summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.kbd{font:12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.prose p{margin:.5em 0}.prose li{margin:.25em 0}.prose h3{margin-top:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

  <div class="brand">

const SELF = { results: [], running: false, at: null };
async function runSelfTests() {

}

function securityAudit() {
  const keys = []; try { for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i)); } catch { }
  const stored = keys.map(k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } }).join('\n');
  const rows = [['Page is served over HTTPS or localhost', location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:' ? (location.protocol === 'file:' ? ['INFO', 'Opened from disk: fine for demo mode; live sign-in needs http(s)'] : ['PASS', location.origin]) : ['FAIL', 'Use HTTPS for live Drive']],
  ['Content-Security-Policy limits network to googleapis.com / accounts.google.com', document.querySelector('meta[http-equiv="Content-Security-Policy"]') ? ['PASS', 'meta CSP present'] : ['FAIL', 'missing']],
  ['Access token is not written to browser storage', Auth.token && stored.includes(Auth.token) ? ['FAIL', 'token found in storage'] : ['PASS', Auth.token ? 'token only in memory' : 'no token held']],
  ['No client secret or password field exists', ['PASS', 'Web client ID only (public); sign-in happens in Google’s own window']],
  ['Authorization header goes only to https://www.googleapis.com/', ['PASS', 'enforced in code; covered by a self-test']],
  ['Downloaded files are never opened automatically', ['PASS', '“Open” previews only PDF/images/text/audio/video; everything else is saved, not executed']],
  ['File names are sanitised; no user path is ever used as a storage path', ['PASS', 'covered by a self-test']],
  ['Permanent downloads are separated from cache', ['PASS', 'separate directories; covered by a self-test']],
  ['Permissions requested', ['PASS', 'none up front. Optional: persistent storage, folder picker (each shows a browser prompt)']]];
  return rows;
}

  <tr><td><b>ContentProvider.openFile</b></td><td>Yes</td><td>Same as above</td><td>Yes</td><td>Yes, via content:// URIs</td><td>None</td><td>All</td><td>Receiver must accept content:// URIs</td></tr>
  <tr><td><b>ParcelFileDescriptor</b> (pipes)</td><td>Yes</td><td><b>No</b>: pipes are not seekable</td><td>Yes</td><td>Yes</td><td>None</td><td>All</td><td>Unsuitable for seeking readers</td></tr>
  <tr><td><b>StorageManager.openProxyFileDescriptor</b> + ProxyFileDescriptorCallback</td><td>Yes: your callback fetches bytes</td><td>Yes: onRead(offset, size) is called per read</td><td>Yes</td><td>Yes, when handed out through a provider</td><td>None</td><td>8.0+ (API 26)</td><td>Reads are synchronous callbacks (latency is felt directly). mmap on such descriptors is <span class="chip amber">needs validation</span>; assume not supported</td></tr>
  <tr><td><b>App-specific / private storage</b></td><td>No</td><td>n/a</td><td>n/a</td><td>No: other apps cannot write into it</td><td>Root only</td><td>Sandbox since 4.x; scoped storage 10/11+</td><td>A game's own folders are off limits to a normal app</td></tr>
  <tr><td><b>FUSE / mounting a virtual disk</b></td><td>Possible</td><td>Yes</td><td>Yes</td><td>Yes</td><td><b>Root / OS changes</b></td><td>n/a</td><td>Out of scope: no root assumed</td></tr>
  <tr><td><b>Web: HTTP Range + block cache</b> (this page)</td><td>Yes</td><td>Yes (verified by probe)</td><td>Yes</td><td>No: only this page</td><td>None</td><td>Modern browsers</td><td>Does not expose a file to other apps. Live-Drive CORS/Range exposure <span class="chip amber">needs validation</span></td></tr>
  </tbody></table></div><p class="tiny mute">Documented-vs-assumed split: the API levels and the proxy-descriptor design are documented platform features; their behaviour under real games, mmap, and sustained load are not demonstrated by this project.</p></div>

  <div class="card"><h3>2 · Google Drive range requests</h3><ul class="small"><li><span class="chip green">Documented</span> <span class="kbd">files.get?alt=media</span> accepts a standard HTTP <span class="kbd">Range</span> header and answers <span class="kbd">206 Partial Content</span> with <span class="kbd">Content-Range</span>. Drive also uses it to resume downloads.</li><li>This app never trusts that: the probe asks for a range and accepts it only if the status is 206, the start matches, the total matches the file size and overlapping reads agree. A reply of 200 means “range ignored” and block access is refused with a fallback to normal download.</li><li><span class="chip green">Documented</span> Google Docs/Sheets/Slides are <i>exported</i>, not stored as bytes: no Range, no stable size, 10 MB export limit. They are treated separately and are not eligible for virtual access.</li><li>Change detection: each block is keyed by file ID + a version stamp (version, modified time, MD5, size). The stamp is revalidated periodically; if it changes, old blocks are dropped. Metadata is a signal, not a guarantee.</li><li>Rate limits (429 / 403 rateLimit) and download-quota errors are retried with backoff, then surfaced. Expired tokens trigger one silent refresh, then a reconnect prompt.</li><li><span class="chip amber">Needs validation</span> Per-file download quotas and throttling under many small range requests on real accounts were not tested.</li></ul></div>

  <div class="card"><h3>3 · Architecture (as implemented here)</h3>
  <svg viewBox="0 0 640 190" role="img" aria-label="Reader asks the virtual file for offset and length; the virtual file maps to blocks, checks the block cache, and fetches missing blocks by HTTP range from Google Drive" style="width:100%;height:auto;max-width:640px">
   <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="currentColor"/></marker></defs>
   <g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="60" width="110" height="60" rx="10"/><rect x="170" y="60" width="140" height="60" rx="10"/><rect x="362" y="10" width="120" height="50" rx="10"/><rect x="362" y="120" width="120" height="50" rx="10"/><rect x="520" y="60" width="112" height="60" rx="10"/>
   <path d="M118 90H168" marker-end="url(#ar)"/><path d="M310 78L360 40" marker-end="url(#ar)"/><path d="M310 102L360 140" marker-end="url(#ar)"/><path d="M482 150L520 100" marker-end="url(#ar)"/><path d="M482 40L520 80" marker-end="url(#ar)" stroke-dasharray="4 3"/></g>
   <g fill="currentColor" font-size="12" text-anchor="middle"><text x="63" y="88">Test reader</text><text x="63" y="104" font-size="10">read(offset,len)</text><text x="240" y="84">VirtualFile</text><text x="240" y="100" font-size="10">validate · map to blocks</text><text x="422" y="32">Block cache</text><text x="422" y="48" font-size="10">LRU · atomic writes</text><text x="422" y="142">Block fetcher</text><text x="422" y="158" font-size="10">dedupe · retry · bound</text><text x="576" y="88">Google Drive</text><text x="576" y="104" font-size="10">Range: bytes=a-b</text></g></svg>
  <p class="small soft">A read is validated (non-negative safe integers, no overflow, clipped at EOF), converted to block numbers, served from cached blocks where possible, and otherwise fetched with a ranged request. Concurrent requests for one block share a single download. A block is published only after its exact length was received, so a network failure never leaves a partial block. Total block bytes stay under a budget (LRU eviction); a block that cannot fit is served uncached rather than exceeding the limit. The whole-file cache and permanent downloads from Stages 3–4 are untouched and remain the fallback.</p></div>

  <div class="card"><h3>4 · Game compatibility</h3><div class="scroll"><table><thead><tr><th>Category</th><th>Classification</th><th>Reasoning</th></tr></thead><tbody>
  <tr><td><b>A.</b> Games reading user-picked files (maps, mods, textures via the file picker)</td><td><span class="chip amber">Potentially feasible</span> / needs validation</td><td>A DocumentsProvider returning proxy descriptors would work for apps that read through ContentResolver. Games that copy the file first gain nothing; ones needing a real path cannot use it.</td></tr>
  <tr><td><b>B.</b> Games loading from their own app-specific directories</td><td><span class="chip red">Generally incompatible</span></td><td>The Android sandbox and scoped storage stop a normal app from placing files inside another app’s private storage. It needs the game’s cooperation, or root, which is out of scope.</td></tr>
  <tr><td><b>C.</b> Expansion files / asset packs</td><td><span class="chip amber">Only with app-specific integration</span></td><td>Play Asset Delivery (install-time, fast-follow, on-demand packs) is delivered by Google Play to the game itself, not from Drive, and the game must be built for it. OBB expansion files are the legacy mechanism. These can avoid up-front downloads only because the game requests packs at runtime.</td></tr>
  <tr><td><b>D.</b> APK assets, native libraries, memory-mapped files</td><td><span class="chip red">Generally incompatible</span></td><td>Assets are read from the signed APK; native libraries are loaded by the OS linker; mmap needs real file-backed pages. None can be transparently redirected to a remote source without modifying the app or the OS.</td></tr>
  <tr><td><b>E.</b> Anti-cheat / integrity checking</td><td><span class="chip amber">Needs validation, expect problems</span></td><td>Moved paths, unusual loaders or virtualised files can trip integrity checks. This project does not and will not try to bypass DRM, anti-cheat, or signature checks.</td></tr></tbody></table></div></div>

  <div class="card"><h3>5 · Can a game start before everything is downloaded?</h3><div class="scroll"><table><thead><tr><th>Approach</th><th>Realistic for an ordinary app without root?</th></tr></thead><tbody>
  <tr><td>Download everything first</td><td>Yes: works for every game. This is what Stages 3–4 do.</td></tr>
  <tr><td>Download required assets on demand</td><td>Only if the game itself requests assets (e.g. Play Asset Delivery) or you pre-fetch a known list.</td></tr>
  <tr><td>Stream selected assets while the game runs</td><td>Only with game integration.</td></tr>
  <tr><td>Expose remote data through a virtual file descriptor</td><td>Works for apps that read via the system file APIs; <b>not</b> a virtual disk, not mmap-friendly, not visible by path.</td></tr>
  <tr><td>Modify the game’s loading architecture</td><td>Requires the game developer.</td></tr>
  <tr><td>Run an existing unmodified game against remote files</td><td>Not realistic without root or OS changes.</td></tr></tbody></table></div>
  <p class="small soft">Games expect immediate, synchronous, low-latency random reads, often memory-mapped, with direct paths and native file locking. A network read costs tens to hundreds of milliseconds (more on mobile data), against microseconds for flash. A level load that issues thousands of reads would stall on loading screens, and a read during gameplay can freeze a frame or trigger a watchdog crash. A virtual descriptor is a stream you implement, not a disk.</p></div>

  <div class="card"><h3>6 · Performance results</h3>${meas}<p class="tiny mute">Measured by this page with the conditions shown. Simulated-network runs use a generated file and a simulated server, so they show the cache logic, not real Google throughput. Re-run with “Real Google Drive” on your phone and network for real figures.</p></div>

  <div class="card"><h3>7 · Risks</h3><ul class="small"><li><b>Latency:</b> every cache miss costs a network round trip; random access on slow links is dominated by latency, not bandwidth.</li><li><b>Bandwidth waste:</b> large blocks amplify small reads (see the block-size comparison).</li><li><b>Offline:</b> only blocks already cached can be read; the rest fails with a clear error.</li><li><b>API limits:</b> per-user rate limits, per-file download quotas, restricted scopes (<span class="kbd">drive.readonly</span> needs Google verification for public release).</li><li><b>Storage:</b> browser quota is a share of free disk and can be evicted unless storage is persisted.</li><li><b>Background work:</b> a web page cannot keep downloading when closed; an Android app would use WorkManager and a foreground service.</li><li><b>Compatibility:</b> see section 4; the main risk is promising something that games do not support.</li></ul></div>

  <div class="card good"><h3>8 · Recommendation</h3><ol class="small"><li>Keep <b>whole-file download + whole-file cache</b> as the reliable default; it works with every game.</li><li>Add a <b>“pre-fetch this game’s folder”</b> mode (queue every file in a Drive folder, resumable, verified) rather than runtime streaming.</li><li>Treat the block cache and a DocumentsProvider with proxy descriptors as an <b>opt-in experiment</b> for apps that read through the system file picker (media players, viewers, mod loaders), and test with each target app before claiming support.</li><li>Do <b>not</b> pursue app-private-directory redirection, APK/native-library virtualisation or anti-cheat workarounds.</li></ol></div>

  <div class="card"><h3>9 · Working, partial, not implemented</h3><div class="scroll"><table><tbody>
  <tr><td class="pass">Implemented</td><td class="small">Drive browsing (paging, search, type filter, sort, breadcrumbs, back), selection, confirmation, streamed segment downloads with resume, pause, cancel, retry/backoff, MD5/size verification, queue with duplicate prevention, destination choice, whole-file cache with metadata, freshness checks, LRU/expiry/size/low-space cleanup, offline access, startup reconciliation, block cache + range probe + test reader, self-tests.</td></tr>
  <tr><td class="blocked">Partly verified</td><td class="small">Everything above was exercised against the <b>simulated</b> Drive. The live Google path (sign-in, REST calls, CORS and Range headers) uses the documented API but has not been run by me; treat it as untested until you try it.</td></tr>
  <tr><td class="fail">Not implemented</td><td class="small">Android proxy file descriptors / DocumentsProvider (cannot exist in a web page); downloads while the page is closed; thumbnails; Shared drives and “Shared with me”; folder-as-a-unit download; Service-Worker-based virtual URLs (needs a separate script file).</td></tr></tbody></table></div></div>
  </div>`;
}
